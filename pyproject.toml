[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stipple"
version = "1.0.0"
description = "Segmentation-free ligand-receptor co-localisation on raw spatial-transcriptomics transcripts (bivariate Ripley's K, label-permutation envelope, standardised effect size)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Harry Woodward" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["spatial-transcriptomics", "ripley-k", "point-pattern", "ligand-receptor", "segmentation-free", "cosmx"]

# Core runtime dependencies for the co-localisation tools (the `stipple` package).
# For the exact environment that produced the dissertation results, use
# requirements.txt (a full pip freeze). To also load raw CosMx zarr and build the
# CellChatDB panel, install the optional [data] extra.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "shapely>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "networkx>=3.0",
]

[project.optional-dependencies]
data = ["spatialdata>=0.7", "zarr>=3.0", "liana>=1.7"]

[tool.setuptools.packages.find]
where = ["src"]
